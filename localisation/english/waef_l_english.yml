 WAEF_1941_NAME:0 "Eastern Front 1v1 - January 1941"
 WAEF_1941_DESC:0 "A competitive two-player scenario on the World Ablaze map. The Western and Eastern sides are custom countries with no inherited German or Soviet national scripts."
 WAEF_WEF_DESC:0 "The Western Side controls Central Europe, the Balkans and western Poland. It is a scenario country, not Germany."
 WAEF_EEF_DESC:0 "The Eastern Side controls the Soviet territory, the Baltics and the eastern border acquisitions. It is a scenario country, not the Soviet Union."

