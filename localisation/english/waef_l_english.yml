 waef_industry_setup:0 "Industrial Deployment"
 waef_industry_setup_desc:0 "Choose how to distribute the country's normalized military industry. Civilian industry is identical for both players."
 waef_choose_forward_industry:0 "Concentrate Industry Near the Front"
 waef_choose_forward_industry_desc:0 "Deploy 60 military factories across the forward industrial belt. Higher immediate output, but more exposed to an enemy breakthrough."
 waef_choose_deep_industry:0 "Disperse Industry into the Rear"
 waef_choose_deep_industry_desc:0 "Deploy 50 military factories in the deep rear. Lower immediate output, but substantially safer industrial geography."
