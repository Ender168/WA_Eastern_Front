 waef_land_air_doctrine_setup:0 "Pre-War Doctrine Preparation"
 waef_land_air_doctrine_setup_desc:0 "Until 30 January 1941, land and air doctrines are free to acquire. Use the doctrine-preparation decisions to establish the intended starting doctrine package."
 waef_naval_doctrine_lock:0 "Naval Doctrine Deprioritized"
 waef_naval_doctrine_lock_desc:0 "This is a land-war scenario. Naval doctrine cost is increased by 1000%."

 waef_political_setup:0 "Choose Political System"
 waef_political_setup_desc:0 "Each side may make one permanent political choice. Picking one option removes the other two."
 waef_choose_democracy:0 "Adopt Democracy"
 waef_choose_democracy_desc:0 "Change the ruling party to democracy. This choice is permanent for the scenario setup."
 waef_choose_fascism:0 "Adopt Fascism"
 waef_choose_fascism_desc:0 "Change the ruling party to fascism. This choice is permanent for the scenario setup."
 waef_choose_communism:0 "Adopt Communism"
 waef_choose_communism_desc:0 "Change the ruling party to communism. This choice is permanent for the scenario setup."

 waef_land_doctrine_preparation:0 "Land Doctrine Preparation"
 waef_land_doctrine_preparation_desc:0 "Optional setup mastery for the starting land doctrine. Great War doctrine is common to both sides. For Tier 1 and Tier 2, first select the subdoctrine you want in the doctrine screen; the decision supplies mastery but does not choose the branch for you."
 waef_land_great_war_mastery:0 "Complete Great War Land Doctrine"
 waef_land_great_war_mastery_desc:0 "Select the common Great War artillery, armour and infantry doctrines and grant 200 mastery to each."
 waef_land_tier1_artillery_mastery:0 "Tier 1 Artillery: +200 Mastery"
 waef_land_tier1_armour_mastery:0 "Tier 1 Armour: +200 Mastery"
 waef_land_tier1_infantry_mastery:0 "Tier 1 Infantry: +200 Mastery"
 waef_land_tier1_operations_mastery:0 "Tier 1 Operations: +200 Mastery"
 waef_land_tier2_artillery_mastery:0 "Tier 2 Artillery: +100 Mastery"
 waef_land_tier2_armour_mastery:0 "Tier 2 Armour: +100 Mastery"
 waef_land_tier2_infantry_mastery:0 "Tier 2 Infantry: +100 Mastery"
 waef_land_tier2_operations_mastery:0 "Tier 2 Operations: +100 Mastery"

 waef_air_doctrine_preparation:0 "Air Doctrine Preparation"
 waef_air_doctrine_preparation_desc:0 "The common Great War Air Operations tracks are completed at scenario start. For Tier 1, first select the desired subdoctrine in the doctrine screen, then use these optional decisions to add 200 mastery."
 waef_air_tier1_fighter_mastery:0 "Tier 1 Fighter: +200 Mastery"
 waef_air_tier1_strike_mastery:0 "Tier 1 Strike: +200 Mastery"
 waef_air_tier1_naval_aviation_mastery:0 "Tier 1 Naval Aviation: +200 Mastery"
