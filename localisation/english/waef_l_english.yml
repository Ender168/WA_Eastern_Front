 waef_political_alignment:0 "Choose Political System"
 waef_political_alignment_desc:0 "Choose one permanent political alignment for this scenario. The other two choices disappear immediately."
 waef_choose_democracy:0 "Adopt Democracy"
 waef_choose_democracy_desc:0 "Make democracy the sole ruling political system."
 waef_choose_fascism:0 "Adopt Fascism"
 waef_choose_fascism_desc:0 "Make fascism the sole ruling political system."
 waef_choose_communism:0 "Adopt Communism"
 waef_choose_communism_desc:0 "Make communism the sole ruling political system."

 waef_land_mastery:0 "Startup Land Doctrine Mastery"
 waef_land_mastery_desc:0 "Optional startup acceleration for land doctrine. Complete the Great War tracks first, then Tier I, then Tier II. Great War and Tier I grant 200 Mastery per track; Tier II grants 100."
 waef_air_mastery:0 "Startup Air Doctrine Mastery"
 waef_air_mastery_desc:0 "Optional startup acceleration for Air Operations. The Great War air layer is already mastered; these decisions grant 200 Mastery to the selected Tier I tracks."

