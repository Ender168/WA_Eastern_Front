 waef_mobilization_50_desc:0 "Semiannual mobilization waves increase recruitable population by 0.5 percentage points each March 1 and September 1, from 1941 through September 1945. Current bonus: +5.0 percentage points. Maximum bonus: +5 percentage points."
 waef_offensive_momentum:0 "Offensive Momentum"
 waef_offensive_momentum_desc:0 "Land divisions receive a 10% attack bonus while this temporary spirit is active."
 waef.2.t:0 "Scheduled Mobilization Begins"
 waef.2.d:0 "Beginning on March 1, 1941, both fronts receive an additional 0.5 percentage points of recruitable population every March 1 and September 1. The bonus grows to a maximum of 5 percentage points on September 1, 1945. Only the latest mobilization spirit is active; its effects do not stack."
 waef.2.a:0 "Begin mobilization"
 waef_war_setup:0 "Scenario War Preparations"
 waef_war_setup_desc:0 "Both fronts complete their preparations before the war may begin through a scenario decision."
 waef_war_preparation_countdown:0 "War Preparations"
 waef_war_preparation_countdown_desc:0 "The 172-day preparations expire on June 22, 1941. At that point either front may use the scenario war declaration decision."
 waef_declare_scenario_war:0 "Declare War on the Opposing Front"
 waef_declare_scenario_war_desc:0 "Declare war directly on the opposing player, without justifying a war goal. The declaring side gains +10% division attack for 90 days."
 waef_unyielding_resistance:0 "Unyielding Resistance"
 waef_unyielding_resistance_desc:0 "The front fights on until the scenario defeat conditions are met."
 waef_initial_production_drive:0 "Initial Production Drive"
 waef_initial_production_drive_desc:0 "A temporary industrial effort during the first six months of the scenario."
 waef_accelerated_research:0 "Accelerated Research"
 waef_accelerated_research_desc:0 "Extensive research support accelerates the development of the front."
