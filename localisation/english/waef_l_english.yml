 waef_doctrine_preparation:0 "Doctrine Preparation Window"
 waef_doctrine_preparation_desc:0 "Until 30 January, land and air doctrines cost 100% less while naval doctrine costs 1000% more. Use this window to configure the scenario's initial land and air doctrine structure."
 waef_naval_doctrine_lock:0 "Naval Doctrine Deprioritized"
 waef_naval_doctrine_lock_desc:0 "Naval doctrine costs 1000% more. This scenario is designed around a continental land war."
