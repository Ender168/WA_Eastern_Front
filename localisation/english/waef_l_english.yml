 waef_technology_assimilation:0 "Assimilate Foreign Technologies"
 waef_technology_assimilation_desc:0 "Choose one World Ablaze national technology school. The choice is permanent for this scenario."
 waef_assimilate_french_technologies:0 "Assimilate French Technologies"
 waef_assimilate_french_technologies_desc:0 "Permanently adopt the French World Ablaze technology tree."
 waef_assimilate_italian_technologies:0 "Assimilate Italian Technologies"
 waef_assimilate_italian_technologies_desc:0 "Permanently adopt the Italian World Ablaze technology tree."
 waef_assimilate_japanese_technologies:0 "Assimilate Japanese Technologies"
 waef_assimilate_japanese_technologies_desc:0 "Permanently adopt the Japanese World Ablaze technology tree."
 waef_assimilate_german_technologies:0 "Assimilate German Technologies"
 waef_assimilate_german_technologies_desc:0 "Permanently adopt the German World Ablaze technology tree."
 waef_assimilate_soviet_technologies:0 "Assimilate Soviet Technologies"
 waef_assimilate_soviet_technologies_desc:0 "Permanently adopt the Soviet World Ablaze technology tree."
 waef_assimilate_british_technologies:0 "Assimilate British Technologies"
 waef_assimilate_british_technologies_desc:0 "Permanently adopt the British World Ablaze technology tree."
 waef_assimilate_unitedstates_technologies:0 "Assimilate United States Technologies"
 waef_assimilate_unitedstates_technologies_desc:0 "Permanently adopt the United States World Ablaze technology tree."

 waef_apply_1940_technology_baseline:0 "Apply 1940 Technology Baseline"
 waef_apply_1940_technology_baseline_desc:0 "Research every shared technology and every technology in the selected national school dated 1940 or earlier. Doctrine technologies are excluded."

 waef_political_alignment:0 "Choose Political System"
 waef_political_alignment_desc:0 "Choose the ruling ideology for this scenario. The choice is permanent."
 waef_choose_democracy:0 "Adopt Democracy"
 waef_choose_democracy_desc:0 "Set democratic support to 100% and make the democratic party the permanent ruling party."
 waef_choose_fascism:0 "Adopt Fascism"
 waef_choose_fascism_desc:0 "Set fascist support to 100% and make the fascist party the permanent ruling party."
 waef_choose_communism:0 "Adopt Communism"
 waef_choose_communism_desc:0 "Set communist support to 100% and make the communist party the permanent ruling party."
 waef_generic_tank_organization:0 "General Tank Design Bureau"

 waef_create_starting_forces:0 "Deploy Starting Forces"
 waef_create_starting_forces_desc:0 "After applying the 1940 technology baseline, create the standard suppression, infantry and medium tank templates; deploy 300 fully trained infantry divisions and 30 fully trained medium tank divisions in the capital; and commission 50 generals and 5 field marshals."
 waef_create_starting_forces_tt:0 "Create the three scenario templates, deploy 300 infantry and 30 medium tank divisions at full manpower, equipment and training in the capital, and commission 50 generals plus 5 field marshals."

 waef_initial_doctrine_window:0 "Initial Doctrine Preparation"
 waef_initial_doctrine_window_desc:0 "Until 30 January 1941, Land and Air Doctrines cost 100% less while Naval Doctrines cost 1000% more. After that date, only the Naval Doctrine penalty remains."
 waef_naval_doctrine_lock:0 "Naval Doctrine Restriction"
 waef_naval_doctrine_lock_desc:0 "Naval Doctrines cost 1000% more. The scenario is intended to focus doctrine investment on the land and air war."

 waef_land_doctrine_setup:0 "Optional Land Doctrine Setup"
 waef_land_doctrine_setup_desc:0 "Optional startup tools for rapidly preparing the land doctrines needed for the scenario. First choose a subdoctrine in the relevant track, then take its mastery decision. Great War and Tier 1 tracks receive 200 Mastery; Tier 2 tracks receive 100 Mastery."
 waef_air_doctrine_setup:0 "Optional Air Doctrine Setup"
 waef_air_doctrine_setup_desc:0 "Air Operations and all Great War air tracks are already selected and mastered equally for both sides. After choosing a Tier 1 subdoctrine, use these optional startup decisions to grant that track 200 Mastery."

 waef_land_gw_artillery_mastery:0 "Great War Artillery Mastery"
 waef_land_gw_artillery_mastery_desc:0 "After selecting the Great War artillery subdoctrine, grant Tier 0 Artillery 200 Mastery."
 waef_land_gw_armour_mastery:0 "Great War Armour Mastery"
 waef_land_gw_armour_mastery_desc:0 "After selecting the Great War armour subdoctrine, grant Tier 0 Armour 200 Mastery."
 waef_land_gw_infantry_mastery:0 "Great War Infantry Mastery"
 waef_land_gw_infantry_mastery_desc:0 "After selecting the Great War infantry subdoctrine, grant Tier 0 Infantry 200 Mastery."

 waef_land_t1_artillery_mastery:0 "Tier 1 Artillery Mastery"
 waef_land_t1_artillery_mastery_desc:0 "After selecting a Tier 1 artillery subdoctrine, grant its track 200 Mastery."
 waef_land_t1_armour_mastery:0 "Tier 1 Armour Mastery"
 waef_land_t1_armour_mastery_desc:0 "After selecting a Tier 1 armour subdoctrine, grant its track 200 Mastery."
 waef_land_t1_infantry_mastery:0 "Tier 1 Infantry Mastery"
 waef_land_t1_infantry_mastery_desc:0 "After selecting a Tier 1 infantry subdoctrine, grant its track 200 Mastery."

 waef_land_t2_artillery_mastery:0 "Tier 2 Artillery Mastery"
 waef_land_t2_artillery_mastery_desc:0 "After selecting a Tier 2 artillery subdoctrine, grant its track 100 Mastery."
 waef_land_t2_armour_mastery:0 "Tier 2 Armour Mastery"
 waef_land_t2_armour_mastery_desc:0 "After selecting a Tier 2 armour subdoctrine, grant its track 100 Mastery."
 waef_land_t2_infantry_mastery:0 "Tier 2 Infantry Mastery"
 waef_land_t2_infantry_mastery_desc:0 "After selecting a Tier 2 infantry subdoctrine, grant its track 100 Mastery."

 waef_air_t1_fighter_mastery:0 "Tier 1 Fighter Mastery"
 waef_air_t1_fighter_mastery_desc:0 "After selecting a Tier 1 fighter subdoctrine, grant its track 200 Mastery."
 waef_air_t1_strike_mastery:0 "Tier 1 Strike Mastery"
 waef_air_t1_strike_mastery_desc:0 "After selecting a Tier 1 strike subdoctrine, grant its track 200 Mastery."
 waef_air_t1_naval_aviation_mastery:0 "Tier 1 Naval Aviation Mastery"
 waef_air_t1_naval_aviation_mastery_desc:0 "After selecting a Tier 1 naval aviation subdoctrine, grant its track 200 Mastery."
 waef_air_t1_bomber_mastery:0 "Tier 1 Bomber Mastery"
 waef_air_t1_bomber_mastery_desc:0 "After selecting a Tier 1 bomber subdoctrine, grant its track 200 Mastery."
