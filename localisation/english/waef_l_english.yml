 waef_prewar_truce:0 "Mandatory Strategic Patience"
 waef_prewar_truce_desc:0 "War declarations are disabled until the preparation countdown expires on 22 June 1941. Both sides have been granted several months to build armies, draw arrows on maps and pretend nobody knows why the borders are full of tanks."
 waef_offensive_momentum:0 "Opening Offensive"
 waef_offensive_momentum_desc:0 "Army attack: +10% for 90 days. The opening offensive receives a temporary boost because every respectable alternate-history war begins with both staffs insisting that this time the timetable will definitely survive contact with reality."

 waef_war_setup:0 "War Preparation"
 waef_war_setup_desc:0 "The scenario remains under a forced preparation period until 22 June 1941. Afterwards either side may use the dedicated decision to begin the war."
 waef_war_preparation_countdown:0 "Preparation Period"
 waef_war_preparation_countdown_desc:0 "The front remains formally peaceful until 22 June 1941. This is less diplomacy than an internationally recognized appointment with disaster."
 waef_declare_scenario_war:0 "Begin the Eastern Front War"
 waef_declare_scenario_war_desc:0 "Declare war on the opposing player. The side pressing the button receives +10% Army Attack for 90 days. Somebody has to be first to discover that operational plans are not legally binding on the enemy."

 waef.2.t:0 "Scheduled Mobilization Begins"
 waef.2.d:0 "From 1 March 1941 onward, the state will add 0.5 percentage points of recruitable population every 1 March and 1 September. The bonus is cumulative and stops at 5% on 1 September 1945. In other words, the manpower system now has a timetable. Reality has kindly agreed not to ask where the additional cohorts were hiding."
 waef.2.a:0 "Put the calendar in charge of conscription."
