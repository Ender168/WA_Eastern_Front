l_english:
 WAEF_1941_NAME:0 "Eastern Front 1v1 - January 1941"
 WAEF_1941_DESC:0 "A compact competitive land-war scenario on the World Ablaze map. The playable theatre ends at the Urals."
 WAEF_WEF_DESC:0 "The Western Side controls a compact continental European rear and the western half of the Eastern Front."
 WAEF_EEF_DESC:0 "The Eastern Side controls the Eastern Front from the borderlands to the Urals. Siberia and Central Asia are outside the playable theatre."

