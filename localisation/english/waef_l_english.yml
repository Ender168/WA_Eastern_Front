l_english:
 WAEF_1941_NAME:0 "Eastern Front 1v1 - January 1941"
 WAEF_1941_DESC:0 "A competitive Eastern Front scenario built on the complete World Ablaze map and mechanics. Germany and the Soviet Union prepare for a full-scale war while the rest of the world is neutralized under an observer country."
 WAEF_GER_DESC:0 "The western side controls Germany, Central Europe and the Balkan bloc. Prepare the economy, logistics and armed forces before the confrontation with the Soviet player."
 WAEF_SOV_DESC:0 "The eastern side controls the Soviet Union, the Baltic territories and the 1939-40 western acquisitions. Prepare the economy, logistics and armed forces before the confrontation with the German player."
 WAEF_OTHER_DESC:0 "This scenario is designed for Germany and the Soviet Union. Sweden is used as the neutral world-holder."
