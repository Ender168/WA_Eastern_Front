l_english:
 WAEF_GER_TECH_ROOT:0 "German Research Coordination"
 WAEF_GER_TECH_ROOT_desc:0 "Centralize the assimilated German research system and establish a common framework for further wartime development."

 WAEF_GER_INFANTRY_41:0 "Infantry Weapons Programme"
 WAEF_GER_INFANTRY_41_desc:0 "Bring German infantry weapons and specialist training into the 1941 standard."
 WAEF_GER_INFANTRY_43:0 "Infantry Modernisation"
 WAEF_GER_INFANTRY_43_desc:0 "Introduce the next generation of small arms, heavy infantry weapons and reconnaissance training."
 WAEF_GER_INFANTRY_45:0 "Late-War Infantry Systems"
 WAEF_GER_INFANTRY_45_desc:0 "Complete the late-war infantry programme with improved weapons, night fighting equipment and elite-force training."

 WAEF_GER_SUPPORT_41:0 "Divisional Support Standardisation"
 WAEF_GER_SUPPORT_41_desc:0 "Standardize engineers, reconnaissance, maintenance, medical, logistics and signals companies."
 WAEF_GER_SUPPORT_43:0 "Integrated Support Battalions"
 WAEF_GER_SUPPORT_43_desc:0 "Expand divisional support formations and integrate headquarters, camouflage and battlefield medicine."
 WAEF_GER_SUPPORT_45:0 "Late-War Support Organisation"
 WAEF_GER_SUPPORT_45_desc:0 "Bring the German support-company system to its mature late-war organization."

 WAEF_GER_FIREPOWER_41:0 "Artillery and Flak Renewal"
 WAEF_GER_FIREPOWER_41_desc:0 "Modernize field artillery, anti-tank guns, anti-aircraft weapons and rocket artillery."
 WAEF_GER_FIREPOWER_43:0 "Long-Barrelled Firepower"
 WAEF_GER_FIREPOWER_43_desc:0 "Prioritize higher-velocity guns and heavier divisional fire support for the mid-war battlefield."
 WAEF_GER_FIREPOWER_45:0 "Late-War Anti-Armour Network"
 WAEF_GER_FIREPOWER_45_desc:0 "Complete the late-war anti-tank, anti-aircraft and rocket-artillery programmes."

 WAEF_GER_MECH_41:0 "Mechanised Expansion"
 WAEF_GER_MECH_41_desc:0 "Expand mechanized infantry and provide them with dedicated tank-destroyer, artillery and anti-air variants."
 WAEF_GER_MECH_43:0 "Armoured Panzergrenadiers"
 WAEF_GER_MECH_43_desc:0 "Develop more capable mechanized formations for sustained operations alongside the Panzerwaffe."
 WAEF_GER_MECH_45:0 "Fully Mechanised Formations"
 WAEF_GER_MECH_45_desc:0 "Finish the mechanization programme with advanced vehicles, amphibious equipment and armoured reconnaissance."

 WAEF_GER_PANZER_41:0 "Panzerwaffe 1941"
 WAEF_GER_PANZER_41_desc:0 "Modernize the medium-tank force around improved Panzer III and Panzer IV designs and their assault-gun derivatives."
 WAEF_GER_PANTHER_PROGRAM:0 "Panther Programme"
 WAEF_GER_PANTHER_PROGRAM_desc:0 "Shift medium-armour development toward the Panther family while retaining an improved Panzer IV line."
 WAEF_GER_PANTHER_REFINEMENT:0 "Panther Refinement"
 WAEF_GER_PANTHER_REFINEMENT_desc:0 "Refine the Panther platform and develop specialized tank-destroyer, assault-gun and anti-air variants."
 WAEF_GER_HEAVY_ARMOUR:0 "Heavy Breakthrough Programme"
 WAEF_GER_HEAVY_ARMOUR_desc:0 "Commit engineering capacity to the Tiger family and heavy breakthrough warfare. This priority excludes the Focke-Wulf development programme."
 WAEF_GER_TIGER_II:0 "Tiger II Programme"
 WAEF_GER_TIGER_II_desc:0 "Push the heavy-armour concept to its late-war conclusion with the Tiger II and specialized heavy variants."

 WAEF_GER_LUFTWAFFE_41:0 "Luftwaffe 1941 Programme"
 WAEF_GER_LUFTWAFFE_41_desc:0 "Bring fighters, close-air-support aircraft, bombers, reconnaissance aircraft and maritime patrol designs to a common 1941 standard."
 WAEF_GER_MESSERSCHMITT:0 "Messerschmitt Continuation"
 WAEF_GER_MESSERSCHMITT_desc:0 "Continue development of the Bf 109 family through its later high-performance variants."
 WAEF_GER_FOCKE_WULF:0 "Focke-Wulf Priority"
 WAEF_GER_FOCKE_WULF_desc:0 "Commit engineering capacity to the Fw 190 multirole fighter family. This priority excludes the German heavy-breakthrough tank programme."
 WAEF_GER_FOCKE_WULF_LATE:0 "Focke-Wulf Refinement"
 WAEF_GER_FOCKE_WULF_LATE_desc:0 "Develop the mature Fw 190 family into increasingly capable multirole and high-altitude variants."
 WAEF_GER_GROUND_ATTACK_43:0 "Schlachtflieger Programme"
 WAEF_GER_GROUND_ATTACK_43_desc:0 "Concentrate on dedicated battlefield attack aircraft and improved close-air-support designs."
 WAEF_GER_GROUND_ATTACK_45:0 "Late-War Ground Attack"
 WAEF_GER_GROUND_ATTACK_45_desc:0 "Complete the late-war ground-attack programme with more powerful dedicated attackers and CAS aircraft."
 WAEF_GER_BOMBER_43:0 "Operational Bomber Programme"
 WAEF_GER_BOMBER_43_desc:0 "Develop tactical, fast and strike bombers while opening a limited strategic-bomber programme."
 WAEF_GER_BOMBER_45:0 "Late-War Bomber Development"
 WAEF_GER_BOMBER_45_desc:0 "Expand late-war bomber development into heavier and more advanced operational designs."

 WAEF_GER_INDUSTRY_41:0 "War Production Rationalisation"
 WAEF_GER_INDUSTRY_41_desc:0 "Apply assembly-line methods, industrial organization and improved construction to wartime production."
 WAEF_GER_INDUSTRY_43:0 "Armaments Expansion"
 WAEF_GER_INDUSTRY_43_desc:0 "Expand armaments production through cranes, larger industrial systems and improved resource processing."
 WAEF_GER_STREAMLINED:0 "Streamlined Mass Production"
 WAEF_GER_STREAMLINED_desc:0 "Prioritize long production runs, standardization and maximum output. This choice excludes a flexible production network."
 WAEF_GER_FLEXIBLE:0 "Flexible Production Network"
 WAEF_GER_FLEXIBLE_desc:0 "Prioritize adaptable production, construction capacity and resource extraction. This choice excludes streamlined mass production."

 WAEF_GER_ELECTRONICS_41:0 "Radar and Computing Coordination"
 WAEF_GER_ELECTRONICS_41_desc:0 "Coordinate radar, computing, encryption and decryption development under a single technical programme."
 WAEF_GER_ADVANCED_RESEARCH:0 "Advanced Weapons Research"
 WAEF_GER_ADVANCED_RESEARCH_desc:0 "Concentrate high-level research on advanced computing, cryptography, rockets, jet propulsion and atomic science."
 WAEF_GER_ROCKET_AGE:0 "Rocket and Jet Programme"
 WAEF_GER_ROCKET_AGE_desc:0 "Move experimental work into practical rocket propulsion and nuclear-reactor development."

 WAEF_GER_NAVY_41:0 "Kriegsmarine 1941"
 WAEF_GER_NAVY_41_desc:0 "Modernize the German naval programme before choosing between submarine warfare and a renewed surface fleet."
 WAEF_GER_UBOAT_43:0 "Advanced U-Boat Programme"
 WAEF_GER_UBOAT_43_desc:0 "Prioritize advanced submarines, snorkels, homing torpedoes and mine warfare. This choice excludes the surface-fleet programme."
 WAEF_GER_UBOAT_45:0 "Late-War U-Boat Fleet"
 WAEF_GER_UBOAT_45_desc:0 "Complete the late-war submarine programme with improved boats, snorkels and naval mines."
 WAEF_GER_SURFACE_43:0 "Surface Fleet Programme"
 WAEF_GER_SURFACE_43_desc:0 "Prioritize destroyers, cruisers, carriers and capital ships. This choice excludes the advanced U-boat programme."
 WAEF_GER_SURFACE_45:0 "Late-War Surface Fleet"
 WAEF_GER_SURFACE_45_desc:0 "Complete the late-war surface programme with advanced escorts, cruisers and carriers."
