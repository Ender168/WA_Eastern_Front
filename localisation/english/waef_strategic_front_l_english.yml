l_english:
 waef_strategic_front:0 "Strategic Front Objectives"
 waef_strategic_front_desc:0 "Enemy cities taken: §Y[?waef_strategic_captured|0]/20§!. Own cities lost: §R[?waef_strategic_lost|0]/20§!. Confirming a city requires holding its VP province for 14 days. Capturing 16 and maintaining that count for 30 days yields strategic victory."
