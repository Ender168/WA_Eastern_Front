 waef_prepare_defensive_line_british_desc:0 "Works take 14 days and use two civilian factories. Cost: 25 political power (15 after the French operational focus), +2 fatigue. Up to three predefined land provinces receive level 2 forts. Existing higher forts are preserved. Losing full control cancels works without refunding fatigue. This defensive line cannot be repeated."
