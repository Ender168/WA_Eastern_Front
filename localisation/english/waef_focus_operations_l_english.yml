l_english:
 waef_operations:0 "Offensive Operations and Defensive Lines"
 waef_operations_desc:0 "Plan limited frontline operations. Fatigue and resources are charged when preparation begins. One offensive operation and one fortification project may be active at a time."
 waef_operation_targets_tt:0 "Every province of each target state must be under full friendly control. A fully controlling allied country also qualifies."
 waef_local_offensive:0 "Local Offensive: [FROM.GetName]"
 waef_local_offensive_desc:0 "Target: one adjacent enemy state. Preparation: 7 days. Offensive: 21 days, or 28 after the Japanese operational focus. Cost: 25 political power, 25 command power and +2 fatigue. +5% attack in the target state during the offensive. Success: −1 fatigue, +1 percentage point war support. Failure: +1 fatigue, −2 percentage points war support. Each target has a 365-day cooldown. The Italian operational focus reduces political cost to 20."
 waef_local_cost_tt:0 "25 political power and 25 command power; 20 political power with the Italian operational focus."
 waef_regional_cost_tt:0 "50 political power and 50 command power; 40 command power with the American operational focus."
 waef_fort_cost_tt:0 "25 political power; 15 with the French operational focus."
 WAEF_OPERATION_REGION_5:0 "Benelux Region"
 waef_regional_offensive_5_standard:0 "Regional Operation: $WAEF_OPERATION_REGION_5$"
 waef_regional_offensive_5_standard_desc:0 "Target states: $STATE_6$, $STATE_7$, $STATE_8$, $STATE_34$, $STATE_35$, $STATE_36$, $STATE_790$, $STATE_979$, $STATE_985$. States are assigned by majority of land provinces in the air region and are never split. Preparation: 14 days. Offensive: 45 days, or 52 with the Soviet operational focus. Cost: 50 political power, 50 command power (40 with the American operational focus), +5 fatigue. Regional bonus: +5% attack and +10% organisation recovery. Success: −2 fatigue, +3 percentage points war support. Failure: +3 fatigue, −5 percentage points war support. Target states have a 365-day operation cooldown."
