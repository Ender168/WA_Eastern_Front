 waef_tactical_operations_desc:0 "The bonus applies in the selected state with at least 7 land provinces. Preparation: 7 days and +2% fatigue immediately. Offensive: 14 days and +5% attack. Every 7 offensive days: +1% fatigue. Full conquest completes the mission and refunds preparation fatigue."
 waef_strategic_operations_desc:0 "The bonus applies in every playable state of the selected air region. The opponent must control more than half its land provinces at launch. Preparation: 30 days and +5% fatigue immediately. Offensive: 60 days, +5% attack and +10% organisation recovery. Every 10 offensive days: +1% fatigue. Full conquest completes the mission and refunds preparation fatigue."
