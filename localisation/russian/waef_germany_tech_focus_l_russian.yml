l_russian:
 WAEF_GER_TECH_ROOT:0 "Координация германских исследований"
 WAEF_GER_TECH_ROOT_desc:0 "Централизовать ассимилированную германскую научную систему и создать общую основу для дальнейшего военного развития."

 WAEF_GER_INFANTRY_41:0 "Программа пехотного вооружения"
 WAEF_GER_INFANTRY_41_desc:0 "Довести германское пехотное вооружение и подготовку специальных частей до стандарта 1941 года."
 WAEF_GER_INFANTRY_43:0 "Модернизация пехоты"
 WAEF_GER_INFANTRY_43_desc:0 "Внедрить новое поколение стрелкового и тяжёлого пехотного вооружения, а также улучшенную разведывательную подготовку."
 WAEF_GER_INFANTRY_45:0 "Пехотные системы поздней войны"
 WAEF_GER_INFANTRY_45_desc:0 "Завершить программу поздней войны улучшенным вооружением, приборами ночного видения и подготовкой элитных частей."

 WAEF_GER_SUPPORT_41:0 "Стандартизация дивизионного обеспечения"
 WAEF_GER_SUPPORT_41_desc:0 "Стандартизировать инженерные, разведывательные, ремонтные, медицинские, снабженческие и связные роты."
 WAEF_GER_SUPPORT_43:0 "Интегрированные батальоны поддержки"
 WAEF_GER_SUPPORT_43_desc:0 "Расширить дивизионные части обеспечения и объединить штабы, маскировку и полевую медицину."
 WAEF_GER_SUPPORT_45:0 "Организация обеспечения поздней войны"
 WAEF_GER_SUPPORT_45_desc:0 "Довести систему германских рот поддержки до зрелого уровня позднего периода войны."

 WAEF_GER_FIREPOWER_41:0 "Обновление артиллерии и ПВО"
 WAEF_GER_FIREPOWER_41_desc:0 "Модернизировать полевую артиллерию, противотанковые и зенитные орудия, а также реактивную артиллерию."
 WAEF_GER_FIREPOWER_43:0 "Длинноствольная огневая мощь"
 WAEF_GER_FIREPOWER_43_desc:0 "Сделать ставку на более скорострельные и мощные орудия и тяжёлую дивизионную огневую поддержку."
 WAEF_GER_FIREPOWER_45:0 "Противотанковая сеть поздней войны"
 WAEF_GER_FIREPOWER_45_desc:0 "Завершить поздние программы противотанкового, зенитного и реактивного вооружения."

 WAEF_GER_MECH_41:0 "Расширение механизации"
 WAEF_GER_MECH_41_desc:0 "Расширить механизированную пехоту и обеспечить её специализированными ПТ, артиллерийскими и зенитными машинами."
 WAEF_GER_MECH_43:0 "Бронированные панцергренадеры"
 WAEF_GER_MECH_43_desc:0 "Разработать более совершенные механизированные соединения для длительных действий совместно с танковыми войсками."
 WAEF_GER_MECH_45:0 "Полностью механизированные соединения"
 WAEF_GER_MECH_45_desc:0 "Завершить программу механизации передовой техникой, амфибийными машинами и бронированной разведкой."

 WAEF_GER_PANZER_41:0 "Панцерваффе 1941"
 WAEF_GER_PANZER_41_desc:0 "Модернизировать средние танки вокруг улучшенных Panzer III и Panzer IV и их штурмовых вариантов."
 WAEF_GER_PANTHER_PROGRAM:0 "Программа Panther"
 WAEF_GER_PANTHER_PROGRAM_desc:0 "Перенаправить развитие средних танков к семейству Panther, сохранив модернизированную линию Panzer IV."
 WAEF_GER_PANTHER_REFINEMENT:0 "Доводка Panther"
 WAEF_GER_PANTHER_REFINEMENT_desc:0 "Совершенствовать платформу Panther и разработать специализированные ПТ, штурмовые и зенитные варианты."
 WAEF_GER_HEAVY_ARMOUR:0 "Программа тяжёлого прорыва"
 WAEF_GER_HEAVY_ARMOUR_desc:0 "Направить инженерные ресурсы на семейство Tiger и тяжёлые танки прорыва. Этот приоритет исключает программу Focke-Wulf."
 WAEF_GER_TIGER_II:0 "Программа Tiger II"
 WAEF_GER_TIGER_II_desc:0 "Довести концепцию тяжёлых танков до поздней войны с Tiger II и специализированными тяжёлыми вариантами."

 WAEF_GER_LUFTWAFFE_41:0 "Программа Люфтваффе 1941"
 WAEF_GER_LUFTWAFFE_41_desc:0 "Довести истребители, штурмовики, бомбардировщики, разведчики и морские патрульные самолёты до общего стандарта 1941 года."
 WAEF_GER_MESSERSCHMITT:0 "Продолжение Messerschmitt"
 WAEF_GER_MESSERSCHMITT_desc:0 "Продолжить развитие семейства Bf 109 до поздних высокоэффективных модификаций."
 WAEF_GER_FOCKE_WULF:0 "Приоритет Focke-Wulf"
 WAEF_GER_FOCKE_WULF_desc:0 "Направить инженерные ресурсы на многоцелевое семейство Fw 190. Этот приоритет исключает германскую программу тяжёлых танков прорыва."
 WAEF_GER_FOCKE_WULF_LATE:0 "Доводка Focke-Wulf"
 WAEF_GER_FOCKE_WULF_LATE_desc:0 "Развить зрелое семейство Fw 190 в более совершенные многоцелевые и высотные модификации."
 WAEF_GER_GROUND_ATTACK_43:0 "Программа Schlachtflieger"
 WAEF_GER_GROUND_ATTACK_43_desc:0 "Сосредоточиться на специализированных самолётах поля боя и улучшенных штурмовиках непосредственной поддержки."
 WAEF_GER_GROUND_ATTACK_45:0 "Штурмовая авиация поздней войны"
 WAEF_GER_GROUND_ATTACK_45_desc:0 "Завершить позднюю программу штурмовой авиации более мощными специализированными самолётами."
 WAEF_GER_BOMBER_43:0 "Программа оперативных бомбардировщиков"
 WAEF_GER_BOMBER_43_desc:0 "Развивать тактические, скоростные и ударные бомбардировщики, одновременно открывая ограниченную программу стратегической авиации."
 WAEF_GER_BOMBER_45:0 "Развитие бомбардировщиков поздней войны"
 WAEF_GER_BOMBER_45_desc:0 "Расширить поздние программы бомбардировщиков в сторону более тяжёлых и совершенных конструкций."

 WAEF_GER_INDUSTRY_41:0 "Рационализация военного производства"
 WAEF_GER_INDUSTRY_41_desc:0 "Применить сборочные линии, улучшенную промышленную организацию и новые методы строительства к военному производству."
 WAEF_GER_INDUSTRY_43:0 "Расширение производства вооружений"
 WAEF_GER_INDUSTRY_43_desc:0 "Расширить выпуск вооружений с помощью новых производственных систем, кранов и улучшенной переработки ресурсов."
 WAEF_GER_STREAMLINED:0 "Поточное массовое производство"
 WAEF_GER_STREAMLINED_desc:0 "Сделать ставку на длинные производственные серии, стандартизацию и максимальный выпуск. Этот выбор исключает гибкую производственную сеть."
 WAEF_GER_FLEXIBLE:0 "Гибкая производственная сеть"
 WAEF_GER_FLEXIBLE_desc:0 "Сделать ставку на адаптивность производства, строительство и добычу ресурсов. Этот выбор исключает поточное массовое производство."

 WAEF_GER_ELECTRONICS_41:0 "Координация РЛС и вычислительной техники"
 WAEF_GER_ELECTRONICS_41_desc:0 "Объединить развитие радиолокации, вычислительной техники, шифрования и дешифрования в одну техническую программу."
 WAEF_GER_ADVANCED_RESEARCH:0 "Исследования перспективных вооружений"
 WAEF_GER_ADVANCED_RESEARCH_desc:0 "Сосредоточить передовые исследования на вычислительной технике, криптографии, ракетах, реактивной тяге и атомной науке."
 WAEF_GER_ROCKET_AGE:0 "Ракетная и реактивная программа"
 WAEF_GER_ROCKET_AGE_desc:0 "Перевести экспериментальные проекты в практические ракетные двигатели и разработку ядерных реакторов."

 WAEF_GER_NAVY_41:0 "Кригсмарине 1941"
 WAEF_GER_NAVY_41_desc:0 "Модернизировать германскую военно-морскую программу перед выбором между подводной войной и возрождением надводного флота."
 WAEF_GER_UBOAT_43:0 "Программа новых U-Boot"
 WAEF_GER_UBOAT_43_desc:0 "Сделать ставку на современные подлодки, шноркели, самонаводящиеся торпеды и минную войну. Этот выбор исключает программу надводного флота."
 WAEF_GER_UBOAT_45:0 "Подводный флот поздней войны"
 WAEF_GER_UBOAT_45_desc:0 "Завершить позднюю программу подлодок улучшенными лодками, шноркелями и морскими минами."
 WAEF_GER_SURFACE_43:0 "Программа надводного флота"
 WAEF_GER_SURFACE_43_desc:0 "Сделать ставку на эсминцы, крейсеры, авианосцы и крупные корабли. Этот выбор исключает программу новых U-Boot."
 WAEF_GER_SURFACE_45:0 "Надводный флот поздней войны"
 WAEF_GER_SURFACE_45_desc:0 "Завершить позднюю программу надводного флота современными кораблями сопровождения, крейсерами и авианосцами."
