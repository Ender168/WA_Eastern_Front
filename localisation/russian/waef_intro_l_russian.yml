l_russian:
 waef_intro.1.t:0 "Добро пожаловать в WA Eastern Front"
 waef_intro.1.d:0 "Две стороны, равный старт, общая цель: разгромить противника. Хотите коротко узнать правила мода?"
 waef_intro.1.read:0 "О моде"
 waef_intro.1.skip:0 "Пропустить"
 waef_intro.2.t:0 "Как играть"
 waef_intro.2.d:0 "§YПодготовка.§! В решениях выберите национальную школу, ассимилируйте технологии и сформируйте армию. Выбранная школа определяет древо фокусов и доступную технику.\n\n§YПобеда.§! Захватите 16 из 20 стратегических городов противника и удерживайте преимущество 30 дней. Захват и освобождение города подтверждаются после 14 дней контроля.\n\n§YОперации.§! Тактическое наступление усиливает один стейт, стратегическое: воздушный регион. Подготовка сразу повышает усталость; наступление добавляет её каждые 7 или 10 дней соответственно. Полный захват целей останавливает таймер и возвращает усталость подготовки.\n\n§YЭкономика.§! Следите за усталостью от законов и вооружений. Призыв постепенно растёт 1 марта и 1 сентября. Стартовые бонусы производства и доктрин ограничены по времени."
 waef_intro.2.close:0 "К делу!"
