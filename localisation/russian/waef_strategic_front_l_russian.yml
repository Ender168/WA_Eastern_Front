l_russian:
 waef_strategic_front:0 "Стратегические цели фронта"
 waef_strategic_front_desc:0 "Захвачено городов противника: §Y[?waef_strategic_captured|0]/20§!. Потеряно своих: §R[?waef_strategic_lost|0]/20§!. Для учёта требуется 14 дней контроля VP-провинции. После захвата 16 городов и 30 дней удержания объявляется стратегическая победа."
 waef_strategic_capture_danzig:0 "Закрепить контроль: Данциг"
 waef_strategic_capture_danzig_desc:0 "Удерживать VP-провинцию 362 14 дней без перерыва. Потеря контроля отменяет миссию."
 waef_strategic_liberate_danzig:0 "Вернуть стратегический город: Данциг"
 waef_strategic_liberate_danzig_desc:0 "Вернуть VP-провинцию 362 и удерживать её 14 дней."
 waef_strategic_captured_danzig:0 "Захвачен: Данциг"
 waef_strategic_captured_danzig_desc:0 "Город засчитан. Противник может отменить захват, отбив город на 14 дней."
 waef_strategic_lost_danzig:0 "Потерян: Данциг"
 waef_strategic_lost_danzig_desc:0 "Противник подтвердил захват города. Верните его на 14 дней, чтобы снять потерю."
