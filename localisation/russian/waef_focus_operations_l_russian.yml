 waef_tactical_operations:0 "Тактические наступления"
 waef_strategic_operations:0 "Стратегические операции"
 waef_tactical_operations_desc:0 "Бонус действует в выбранном стейте с минимум 7 сухопутными провинциями. Подготовка: 7 дней, усталость +2% сразу. Наступление: 14 дней, +5% атаки. Каждые 10 дней наступления: +1% усталости. Полный захват цели завершает миссию и возвращает усталость подготовки."
 waef_strategic_operations_desc:0 "Бонус действует во всех игровых стейтах выбранного воздушного региона. Для запуска противник должен контролировать больше половины его сухопутных провинций. Подготовка: 30 дней, усталость +5% сразу. Наступление: 60 дней, +5% атаки и +10% восстановления организации. Каждые 10 дней наступления: +1% усталости. Полный захват целей завершает миссию и возвращает усталость подготовки."
