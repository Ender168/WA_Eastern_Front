 waef_prepare_defensive_line_standard:0 "Оборонительный рубеж: [FROM.GetName]"
 waef_prepare_defensive_line_standard_desc:0 "Работы: 21 дней, используют две гражданские фабрики. Цена: 25 политвласти (15 после французского оперативного фокуса), усталость +2. До трёх заранее выбранных сухопутных провинций получают укрепления уровня 2. Уже более сильные укрепления сохраняются. Потеря полного контроля отменяет работы без возврата усталости. Повторное строительство этого рубежа недоступно."
 waef_prepare_defensive_line_british:0 "Оборонительный рубеж: [FROM.GetName]"
 waef_prepare_defensive_line_british_desc:0 "Работы: 14 дней, используют две гражданские фабрики. Цена: 25 политвласти (15 после французского оперативного фокуса), усталость +2. До трёх заранее выбранных сухопутных провинций получают укрепления уровня 2. Уже более сильные укрепления сохраняются. Потеря полного контроля отменяет работы без возврата усталости. Повторное строительство этого рубежа недоступно."
