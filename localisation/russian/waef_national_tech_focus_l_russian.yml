 WAEF_GER_C11:0 "Промышленное развитие I"
 WAEF_GER_C11_desc:0 "Длительность: 70 дней. Без календарного ограничения. Общие производственные технологии до 1941. Выдаёт доступные по DLC технологии своего периода."
