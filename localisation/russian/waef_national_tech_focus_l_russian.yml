 WAEF_GER_A3:0 "Messerschmitt III"
 WAEF_GER_A3_desc:0 "Длительность: 91 дней. Без календарного ограничения. Развитие истребителей Bf 109. Выдаёт доступные по DLC технологии своего периода. Реактивная техника выдаётся после электроники III и этапа III соответствующей авиационной ветви, в любом порядке завершения."
