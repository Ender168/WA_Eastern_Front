 WAEF_GER_C13_desc:0 "Длительность: 70 дней. Без календарного ограничения. Общие технологии 1942–1943. Выдаёт доступные по DLC технологии своего периода."
 WAEF_GER_C15:0 "Промышленное развитие III"
 WAEF_GER_C15_desc:0 "Длительность: 70 дней. Без календарного ограничения. Общие технологии 1944–1945. Выдаёт доступные по DLC технологии своего периода."
 WAEF_GER_C21:0 "Электроника I"
