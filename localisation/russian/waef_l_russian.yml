 waef_technology_assimilation:0 "Ассимиляция иностранных технологий"
 waef_technology_assimilation_desc:0 "Выберите одно национальное технологическое дерево World Ablaze. Выбор необратим в рамках сценария."
 waef_assimilate_french_technologies:0 "Ассимилировать французские технологии"
 waef_assimilate_french_technologies_desc:0 "Навсегда принять французское технологическое дерево World Ablaze."
 waef_assimilate_italian_technologies:0 "Ассимилировать итальянские технологии"
 waef_assimilate_italian_technologies_desc:0 "Навсегда принять итальянское технологическое дерево World Ablaze."
 waef_assimilate_japanese_technologies:0 "Ассимилировать японские технологии"
 waef_assimilate_japanese_technologies_desc:0 "Навсегда принять японское технологическое дерево World Ablaze."
 waef_assimilate_german_technologies:0 "Ассимилировать немецкие технологии"
 waef_assimilate_german_technologies_desc:0 "Навсегда принять немецкое технологическое дерево World Ablaze."
 waef_assimilate_soviet_technologies:0 "Ассимилировать советские технологии"
 waef_assimilate_soviet_technologies_desc:0 "Навсегда принять советское технологическое дерево World Ablaze."
 waef_assimilate_british_technologies:0 "Ассимилировать британские технологии"
 waef_assimilate_british_technologies_desc:0 "Навсегда принять британское технологическое дерево World Ablaze."
 waef_assimilate_unitedstates_technologies:0 "Ассимилировать американские технологии"
 waef_assimilate_unitedstates_technologies_desc:0 "Навсегда принять технологическое дерево США World Ablaze."

 waef_apply_1940_technology_baseline:0 "Применить технологический базис 1940 года"
 waef_apply_1940_technology_baseline_desc:0 "Исследовать все общие технологии и все технологии выбранной национальной школы с датой 1940 года или раньше. Доктринальные технологии не выдаются."

 waef_political_alignment:0 "Выбор политического строя"
 waef_political_alignment_desc:0 "Выберите правящую идеологию на этот сценарий. Выбор необратим."
 waef_choose_democracy:0 "Установить демократию"
 waef_choose_democracy_desc:0 "Установить поддержку демократии на 100% и сделать демократическую партию постоянной правящей партией."
 waef_choose_fascism:0 "Установить фашизм"
 waef_choose_fascism_desc:0 "Установить поддержку фашизма на 100% и сделать фашистскую партию постоянной правящей партией."
 waef_choose_communism:0 "Установить коммунизм"
 waef_choose_communism_desc:0 "Установить поддержку коммунизма на 100% и сделать коммунистическую партию постоянной правящей партией."
 waef_generic_tank_organization:0 "Общее танковое КБ"

 waef_create_starting_forces:0 "Развернуть стартовые войска"
 waef_create_starting_forces_desc:0 "После применения технологического базиса 1940 года создать стандартные шаблоны подавления, пехоты и средних танков; развернуть в столице 300 регулярных пехотных и 30 регулярных танковых дивизий; назначить 50 генералов и 5 фельдмаршалов; добавить 1000 бронированных поездов и 1000 грузовиков; запустить 100-недельный ретроактивный учёт manpower."
 waef_create_starting_forces_tt:0 "Создать три сценарных шаблона, развернуть 300 регулярных пехотных и 30 регулярных танковых дивизий с полным личным составом и оснащением, добавить 1000 бронированных поездов и 1000 грузовиков, назначить 50 генералов и 5 фельдмаршалов и в течение 100 недель списывать по 57 400 manpower в неделю."

 waef_initial_doctrine_window:0 "Стартовая подготовка доктрин"
 waef_initial_doctrine_window_desc:0 "До 30 января 1941 года сухопутные и воздушные доктрины стоят на 100% дешевле. Морские доктрины стоят на 1000% дороже, а скорость строительства верфей снижена на 1000%. Штаб Восточного фронта внезапно решил, что океан пока не главная проблема. Редкий случай правильно расставленных приоритетов."
 waef_naval_doctrine_lock:0 "Ограничение морской доктрины"
 waef_naval_doctrine_lock_desc:0 "Морские доктрины стоят на 1000% дороже, а скорость строительства верфей снижена на 1000%. Это сценарий про сухопутную и воздушную войну, который лишь изображает полноценную экономику, а не приглашение срочно строить Флот открытого моря."

 waef_land_doctrine_setup:0 "Опциональная настройка сухопутных доктрин"
 waef_land_doctrine_setup_desc:0 "Стартовая опция для быстрого развития необходимых сухопутных доктрин. Сначала выберите поддоктрину в нужной ветке, затем используйте соответствующее решение на Mastery. Great War и Tier 1 получают 200 Mastery, Tier 2 получает 100 Mastery."
 waef_air_doctrine_setup:0 "Опциональная настройка воздушных доктрин"
 waef_air_doctrine_setup_desc:0 "Air Operations и все воздушные ветки Great War уже выбраны и полностью развиты одинаково для обеих сторон. После выбора поддоктрины Tier 1 можно использовать эти стартовые решения, чтобы выдать выбранной ветке 200 Mastery."

 waef_land_gw_artillery_mastery:0 "Great War: Mastery артиллерии"
 waef_land_gw_artillery_mastery_desc:0 "После выбора артиллерийской поддоктрины Great War выдать Tier 0 Artillery 200 Mastery."
 waef_land_gw_armour_mastery:0 "Great War: Mastery бронетехники"
 waef_land_gw_armour_mastery_desc:0 "После выбора бронетанковой поддоктрины Great War выдать Tier 0 Armour 200 Mastery."
 waef_land_gw_infantry_mastery:0 "Great War: Mastery пехоты"
 waef_land_gw_infantry_mastery_desc:0 "После выбора пехотной поддоктрины Great War выдать Tier 0 Infantry 200 Mastery."

 waef_land_t1_artillery_mastery:0 "Tier 1: Mastery артиллерии"
 waef_land_t1_artillery_mastery_desc:0 "После выбора артиллерийской поддоктрины Tier 1 выдать этой ветке 200 Mastery."
 waef_land_t1_armour_mastery:0 "Tier 1: Mastery бронетехники"
 waef_land_t1_armour_mastery_desc:0 "После выбора бронетанковой поддоктрины Tier 1 выдать этой ветке 200 Mastery."
 waef_land_t1_infantry_mastery:0 "Tier 1: Mastery пехоты"
 waef_land_t1_infantry_mastery_desc:0 "После выбора пехотной поддоктрины Tier 1 выдать этой ветке 200 Mastery."

 waef_land_t2_artillery_mastery:0 "Tier 2: Mastery артиллерии"
 waef_land_t2_artillery_mastery_desc:0 "После выбора артиллерийской поддоктрины Tier 2 выдать этой ветке 100 Mastery."
 waef_land_t2_armour_mastery:0 "Tier 2: Mastery бронетехники"
 waef_land_t2_armour_mastery_desc:0 "После выбора бронетанковой поддоктрины Tier 2 выдать этой ветке 100 Mastery."
 waef_land_t2_infantry_mastery:0 "Tier 2: Mastery пехоты"
 waef_land_t2_infantry_mastery_desc:0 "После выбора пехотной поддоктрины Tier 2 выдать этой ветке 100 Mastery."

 waef_air_t1_fighter_mastery:0 "Tier 1: Mastery истребителей"
 waef_air_t1_fighter_mastery_desc:0 "После выбора истребительной поддоктрины Tier 1 выдать этой ветке 200 Mastery."
 waef_air_t1_strike_mastery:0 "Tier 1: Mastery ударной авиации"
 waef_air_t1_strike_mastery_desc:0 "После выбора поддоктрины ударной авиации Tier 1 выдать этой ветке 200 Mastery."
 waef_air_t1_naval_aviation_mastery:0 "Tier 1: Mastery морской авиации"
 waef_air_t1_naval_aviation_mastery_desc:0 "После выбора поддоктрины морской авиации Tier 1 выдать этой ветке 200 Mastery."
 waef_air_t1_bomber_mastery:0 "Tier 1: Mastery бомбардировщиков"
 waef_air_t1_bomber_mastery_desc:0 "После выбора бомбардировочной поддоктрины Tier 1 выдать этой ветке 200 Mastery."

 waef_reduced_fuel_capacity:0 "Ограниченные топливные хранилища"
 waef_reduced_fuel_capacity_desc:0 "Национальная ёмкость хранения топлива снижена на 75%. Можно сослаться на инфраструктуру, логистику и военные ограничения. Менее торжественное объяснение проще: в этом сценарии топливо должно иметь значение, а не быть декоративной цифрой."
 waef_manpower_accounting:0 "Ретроактивный учёт мобилизации"
 waef_manpower_accounting_desc:0 "Стартовая армия уже появилась полностью укомплектованной, что удобно, но несколько конфликтует с существованием населения. В течение 100 недель резерв уменьшается на 57 400 человек в неделю, пока бухгалтерия догоняет солдат, уже стоящих на карте. Общий счёт: 5 740 000 человек. Историческая симуляция, разумеется."

 waef.1.t:0 "Солдаты не появились из воздуха"
 waef.1.d:0 "Несколько сотен полностью укомплектованных дивизий только что материализовались на карте с завидной административной эффективностью. Поскольку мы всё-таки изображаем военную экономику, резерв теперь оплатит их задним числом: 57 400 человек в неделю в течение 100 недель, всего 5 740 000. Солдаты прибыли первыми. Следующие 700 дней документы будут выяснять, откуда именно."
 waef.1.a:0 "Историческая правдоподобность восстановлена. Почти."
 waef_mobilization_05:0 "Плановая мобилизация: +0.5%"
 waef_mobilization_05_desc:0 "Дополнительный призывной ресурс: +0.5%. Каждое 1 марта и 1 сентября добавляется ещё 0,5 процентного пункта, пока программа не достигнет капа в 5%. Видимо, демографическое планирование становится значительно проще, когда мобилизовать начинает сам календарь."
 waef_mobilization_10:0 "Плановая мобилизация: +1.0%"
 waef_mobilization_10_desc:0 "Дополнительный призывной ресурс: +1.0%. Каждое 1 марта и 1 сентября добавляется ещё 0,5 процентного пункта, пока программа не достигнет капа в 5%. Видимо, демографическое планирование становится значительно проще, когда мобилизовать начинает сам календарь."
