 waef_industry_setup:0 "Размещение промышленности"
 waef_industry_setup_desc:0 "Выберите размещение нормализованной военной промышленности. Гражданская промышленность одинакова у обоих игроков."
 waef_choose_forward_industry:0 "Сконцентрировать промышленность у фронта"
 waef_choose_forward_industry_desc:0 "Разместить 60 военных заводов в прифронтовом промышленном поясе. Выше немедленный выпуск, но больше риск потерять заводы при прорыве."
 waef_choose_deep_industry:0 "Рассредоточить промышленность в тылу"
 waef_choose_deep_industry_desc:0 "Разместить 50 военных заводов в глубоком тылу. Выпуск ниже, зато промышленность заметно безопаснее."
