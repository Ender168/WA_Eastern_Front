 WAEF_1941_NAME:0 "Восточный фронт 1 на 1 - январь 1941"
 WAEF_1941_DESC:0 "Компактный соревновательный сухопутный сценарий на карте World Ablaze. Игровой театр заканчивается у Урала."
 WAEF_WEF_DESC:0 "Западная сторона контролирует компактный материковый тыл в Европе и западную половину Восточного фронта."
 WAEF_EEF_DESC:0 "Восточная сторона контролирует театр от западных границ до Урала. Сибирь и Средняя Азия выведены из игровой зоны."

