 waef_land_air_doctrine_setup:0 "Предвоенная подготовка доктрин"
 waef_land_air_doctrine_setup_desc:0 "До 30 января 1941 года сухопутные и воздушные доктрины бесплатны. Решения подготовки доктрин позволяют сформировать необходимый стартовый набор."
 waef_naval_doctrine_lock:0 "Морская доктрина не в приоритете"
 waef_naval_doctrine_lock_desc:0 "Это сценарий сухопутной войны. Стоимость морских доктрин увеличена на 1000%."

 waef_political_setup:0 "Выбор политической системы"
 waef_political_setup_desc:0 "Каждая сторона может один раз сменить политическую систему. После выбора остальные варианты исчезнут."
 waef_choose_democracy:0 "Установить демократию"
 waef_choose_democracy_desc:0 "Сделать демократическую партию правящей. Выбор необратим в рамках стартовой настройки."
 waef_choose_fascism:0 "Установить фашизм"
 waef_choose_fascism_desc:0 "Сделать фашистскую партию правящей. Выбор необратим в рамках стартовой настройки."
 waef_choose_communism:0 "Установить коммунизм"
 waef_choose_communism_desc:0 "Сделать коммунистическую партию правящей. Выбор необратим в рамках стартовой настройки."

 waef_land_doctrine_preparation:0 "Подготовка сухопутной доктрины"
 waef_land_doctrine_preparation_desc:0 "Опциональная стартовая прокачка сухопутной доктрины. Great War одинаков для обеих сторон. Для Tier 1 и Tier 2 сначала выберите нужную поддоктрину в окне доктрин: решение только даёт mastery и не выбирает ветку за игрока."
 waef_land_great_war_mastery:0 "Завершить сухопутный Great War"
 waef_land_great_war_mastery_desc:0 "Выбрать общие Great War доктрины артиллерии, бронетехники и пехоты и выдать каждой по 200 mastery."
 waef_land_tier1_artillery_mastery:0 "Tier 1 Артиллерия: +200 Mastery"
 waef_land_tier1_armour_mastery:0 "Tier 1 Бронетехника: +200 Mastery"
 waef_land_tier1_infantry_mastery:0 "Tier 1 Пехота: +200 Mastery"
 waef_land_tier1_operations_mastery:0 "Tier 1 Операции: +200 Mastery"
 waef_land_tier2_artillery_mastery:0 "Tier 2 Артиллерия: +100 Mastery"
 waef_land_tier2_armour_mastery:0 "Tier 2 Бронетехника: +100 Mastery"
 waef_land_tier2_infantry_mastery:0 "Tier 2 Пехота: +100 Mastery"
 waef_land_tier2_operations_mastery:0 "Tier 2 Операции: +100 Mastery"

 waef_air_doctrine_preparation:0 "Подготовка воздушной доктрины"
 waef_air_doctrine_preparation_desc:0 "Общие разделы Great War в Air Operations полностью прокачаны со старта. Для Tier 1 сначала выберите нужную поддоктрину в окне доктрин, затем используйте решение на +200 mastery."
 waef_air_tier1_fighter_mastery:0 "Tier 1 Истребители: +200 Mastery"
 waef_air_tier1_strike_mastery:0 "Tier 1 Ударная авиация: +200 Mastery"
