l_russian:
 WAEF_1941_NAME:0 "Восточный фронт 1 на 1 - январь 1941"
 WAEF_1941_DESC:0 "Соревновательный сценарий Восточного фронта на полной карте и механиках World Ablaze. Германия и Советский Союз готовятся к полномасштабной войне, а остальной мир объединён под нейтральным наблюдателем."
 WAEF_GER_DESC:0 "Западная сторона контролирует Германию, Центральную Европу и балканский блок. Подготовьте экономику, логистику и вооружённые силы к войне с советским игроком."
 WAEF_SOV_DESC:0 "Восточная сторона контролирует Советский Союз, Прибалтику и западные приобретения 1939-1940 годов. Подготовьте экономику, логистику и вооружённые силы к войне с немецким игроком."
 WAEF_OTHER_DESC:0 "Сценарий рассчитан на Германию и Советский Союз. OBS используется как нейтральный держатель остального мира и не предназначен для обычной игры."

