l_russian:
 WAEF_1941_NAME:0 "Восточный фронт 1 на 1 - январь 1941"
 WAEF_1941_DESC:0 "Соревновательный сценарий для двух игроков на карте World Ablaze. Западная и Восточная стороны являются отдельными странами и не наследуют национальные скрипты Германии и СССР."
 WAEF_WEF_DESC:0 "Западная сторона контролирует Центральную Европу, Балканы и западную Польшу. Это отдельная сценарная страна, а не Германия."
 WAEF_EEF_DESC:0 "Восточная сторона контролирует советскую территорию, Прибалтику и западные приобретения. Это отдельная сценарная страна, а не СССР."

