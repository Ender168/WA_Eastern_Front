 waef_political_alignment:0 "Выбор политической системы"
 waef_political_alignment_desc:0 "Одноразово выберите политическую систему сценария. После выбора остальные два варианта исчезнут."
 waef_choose_democracy:0 "Установить демократию"
 waef_choose_democracy_desc:0 "Сделать демократию единственной правящей политической системой."
 waef_choose_fascism:0 "Установить фашизм"
 waef_choose_fascism_desc:0 "Сделать фашизм единственной правящей политической системой."
 waef_choose_communism:0 "Установить коммунизм"
 waef_choose_communism_desc:0 "Сделать коммунизм единственной правящей политической системой."

 waef_land_mastery:0 "Стартовый Mastery сухопутных доктрин"
 waef_land_mastery_desc:0 "Опциональное ускорение стартовых сухопутных доктрин. Сначала закройте Great War, затем Tier I и Tier II. Great War и Tier I дают по 200 Mastery на ветку, Tier II — по 100."
 waef_air_mastery:0 "Стартовый Mastery воздушных доктрин"
 waef_air_mastery_desc:0 "Опциональное ускорение Air Operations. Воздушный слой Great War уже закрыт со старта; эти решения дают по 200 Mastery выбранным веткам Tier I."

 waef_land_mastery_t0_artillery:0 "Great War: Mastery артиллерии"
 waef_land_mastery_t0_artillery_desc:0 "Добавить 200 Mastery выбранной артиллерийской доктрине Great War."
 waef_land_mastery_t0_armour:0 "Great War: Mastery бронетехники"
 waef_land_mastery_t0_armour_desc:0 "Добавить 200 Mastery выбранной бронетанковой доктрине Great War."
 waef_land_mastery_t0_infantry:0 "Great War: Mastery пехоты"
 waef_land_mastery_t0_infantry_desc:0 "Добавить 200 Mastery выбранной пехотной доктрине Great War."
 waef_land_mastery_t1_artillery:0 "Tier I: Mastery артиллерии"
 waef_land_mastery_t1_artillery_desc:0 "Добавить 200 Mastery выбранной артиллерийской доктрине Tier I."
 waef_land_mastery_t1_armour:0 "Tier I: Mastery бронетехники"
 waef_land_mastery_t1_armour_desc:0 "Добавить 200 Mastery выбранной бронетанковой доктрине Tier I."
 waef_land_mastery_t1_infantry:0 "Tier I: Mastery пехоты"
 waef_land_mastery_t1_infantry_desc:0 "Добавить 200 Mastery выбранной пехотной доктрине Tier I."
 waef_land_mastery_t2_artillery:0 "Tier II: Mastery артиллерии"
 waef_land_mastery_t2_artillery_desc:0 "Добавить 100 Mastery выбранной артиллерийской доктрине Tier II."
 waef_land_mastery_t2_armour:0 "Tier II: Mastery бронетехники"
 waef_land_mastery_t2_armour_desc:0 "Добавить 100 Mastery выбранной бронетанковой доктрине Tier II."
 waef_land_mastery_t2_infantry:0 "Tier II: Mastery пехоты"
 waef_land_mastery_t2_infantry_desc:0 "Добавить 100 Mastery выбранной пехотной доктрине Tier II."

 waef_air_mastery_fighter:0 "Tier I: Mastery истребителей"
 waef_air_mastery_fighter_desc:0 "Добавить 200 Mastery выбранной истребительной доктрине Tier I."
 waef_air_mastery_strike:0 "Tier I: Mastery ударной авиации"
 waef_air_mastery_strike_desc:0 "Добавить 200 Mastery выбранной ударной доктрине Tier I."
 waef_air_mastery_naval_aviation:0 "Tier I: Mastery морской авиации"
 waef_air_mastery_naval_aviation_desc:0 "Добавить 200 Mastery выбранной доктрине морской авиации Tier I."
 waef_air_mastery_bomber:0 "Tier I: Mastery бомбардировщиков"
 waef_air_mastery_bomber_desc:0 "Добавить 200 Mastery выбранной бомбардировочной доктрине Tier I."

 waef_doctrine_preparation:0 "Окно подготовки доктрин"
 waef_doctrine_preparation_desc:0 "До 30 января сухопутные и воздушные доктрины стоят на 100% дешевле, а морские — на 1000% дороже. Это окно предназначено для настройки стартовых доктрин сценария."
 waef_naval_doctrine_lock:0 "Морская доктрина не в приоритете"
 waef_naval_doctrine_lock_desc:0 "Стоимость морских доктрин увеличена на 1000%. Сценарий построен вокруг континентальной сухопутной войны."
