 waef_prewar_truce:0 "Обязательное стратегическое терпение"
 waef_prewar_truce_desc:0 "Объявление войны запрещено до завершения подготовительного периода 22 июня 1941 года. Обеим сторонам выдано несколько месяцев, чтобы построить армии, нарисовать стрелочки на картах и сделать вид, будто никто не понимает, зачем вдоль границы стоят танки."
 waef_offensive_momentum:0 "Начальный натиск"
 waef_offensive_momentum_desc:0 "Атака армии: +10% на 90 дней. Начальное наступление получает временный бонус, потому что всякая уважающая себя альтернативно-историческая война должна начинаться с уверенности штабов, что именно их расписание переживёт встречу с реальностью."

 waef_war_setup:0 "Подготовка к войне"
 waef_war_setup_desc:0 "До 22 июня 1941 года действует обязательный подготовительный период. После его завершения любая сторона может отдельным решением начать войну."
 waef_war_preparation_countdown:0 "Подготовительный период"
 waef_war_preparation_countdown_desc:0 "Фронт формально сохраняет мир до 22 июня 1941 года. Это не столько дипломатия, сколько заранее согласованная дата катастрофы."
 waef_declare_scenario_war:0 "Начать войну на Восточном фронте"
 waef_declare_scenario_war_desc:0 "Объявить войну противоположной стороне. Нажавший решение получает +10% к атаке армии на 90 дней. Кто-то должен первым выяснить, что оперативный план не является юридически обязательным для противника."

 waef.2.t:0 "Начинается плановая мобилизация"
 waef.2.d:0 "С 1 марта 1941 года государство получает по 0,5 процентного пункта дополнительного призывного ресурса каждое 1 марта и 1 сентября. Бонус накапливается и достигает максимума в 5% 1 сентября 1945 года. Иными словами, теперь у manpower есть расписание. Реальность любезно согласилась не спрашивать, где всё это время прятались дополнительные возрастные когорты."
 waef.2.a:0 "Поручить призыв календарю."
