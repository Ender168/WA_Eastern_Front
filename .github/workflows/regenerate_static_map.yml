name: Regenerate WAEF map

on:
  push:
    branches:
      - feature/start-armies-politics-doctrine-mastery
    paths:
      - tools/regenerate_clean_scenario.py
      - .github/workflows/regenerate_static_map.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[generated-map]') }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/start-armies-politics-doctrine-mastery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow numpy
      - run: python tools/regenerate_clean_scenario.py
      - name: Commit generated map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/states map/railways.txt map/supply_nodes.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[generated-map] Swap detached EEF states and rebuild supply"
          git push origin HEAD:feature/start-armies-politics-doctrine-mastery
