name: Regenerate WAEF static map

on:
  push:
    branches:
      - fix/static-clean-map-v2
    paths:
      - tools/regenerate_clean_scenario.py
      - .github/workflows/regenerate_static_map.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[generated-states]') }}

    steps:
      - name: Checkout WAEF
        uses: actions/checkout@v4
        with:
          ref: fix/static-clean-map-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install map tooling
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Regenerate states, supply hubs and railways
        run: python tools/regenerate_clean_scenario.py

      - name: Commit generated map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/states map/railways.txt map/supply_nodes.txt
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "[generated-states] Rebuild static WAEF map"
          git push origin HEAD:fix/static-clean-map-v2
