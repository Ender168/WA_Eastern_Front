name: Regenerate 1940 technology baseline

on:
  push:
    branches:
      - feature/free-division-template-design
    paths:
      - tools/generate_1940_tech_baseline.py
      - .github/workflows/regenerate_tech_baseline.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[generated-tech]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/free-division-template-design
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate baseline
        run: python tools/generate_1940_tech_baseline.py
      - name: Commit generated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add common/scripted_effects/waef_1940_tech_baseline.txt docs/TECH_BASELINE_1940.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[generated-tech] Add free division-design unlock techs"
          git push origin HEAD:feature/free-division-template-design
