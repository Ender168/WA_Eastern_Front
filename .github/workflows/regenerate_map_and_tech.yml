name: Regenerate WAEF map and tech baseline

on:
  push:
    branches:
      - feature/1940-tech-baseline-and-doctrines
    paths:
      - tools/regenerate_clean_scenario.py
      - tools/generate_1940_tech_baseline.py
      - .github/workflows/regenerate_map_and_tech.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[generated-assets]') }}

    steps:
      - name: Checkout WAEF
        uses: actions/checkout@v4
        with:
          ref: feature/1940-tech-baseline-and-doctrines
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install map tooling
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Regenerate static map
        run: python tools/regenerate_clean_scenario.py

      - name: Generate 1940 technology baseline
        run: python tools/generate_1940_tech_baseline.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/states map/railways.txt map/supply_nodes.txt common/scripted_effects/waef_1940_tech_baseline.txt docs/TECH_BASELINE_1940.md
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "[generated-assets] Rebuild map and 1940 tech baseline"
          git push origin HEAD:feature/1940-tech-baseline-and-doctrines
