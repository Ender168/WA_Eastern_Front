name: Generate static map and supply mesh

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/regenerate_clean_scenario.py"
      - ".github/workflows/generate-static-states.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scenario repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependencies
        run: python -m pip install numpy pillow

      - name: Regenerate static map and regional supply mesh
        run: python tools/regenerate_clean_scenario.py

      - name: Commit generated map assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A history/states map/supply_nodes.txt map/railways.txt
          if git diff --cached --quiet; then
            echo "No generated map changes to commit."
            exit 0
          fi
          git commit -m "[generated-states] Rebuild static WAEF map and supply mesh"
          git push
