name: Generate static state map

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scenario repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare committed static state baseline
        shell: bash
        run: |
          rm -rf /tmp/waef-base
          mkdir -p /tmp/waef-base
          git archive origin/main history/states | tar -x -C /tmp/waef-base

      - name: Generate normalized WEF EEF OBS state histories
        run: |
          python tools/generate_static_states.py /tmp/waef-base/history/states history/states

      - name: Commit generated state map
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A history/states
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Regenerate normalized WEF EEF OBS state map"
          git push
